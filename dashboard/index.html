<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1, user-scalable=no">
  <title>Family dashboard</title>
</head>
<body>
  <nav class="rail" aria-label="Sections">
    <button type="button" class="rail-item" data-go="home"><span class="rail-icon" data-icon="home"></span><span>Home</span></button>
    <button type="button" class="rail-item" data-go="calendar"><span class="rail-icon" data-icon="calendar"></span><span>Calendar</span></button>
    <button type="button" class="rail-item" data-go="tasks"><span class="rail-icon" data-icon="tasks"></span><span>Tasks</span></button>
    <button type="button" class="rail-item" data-go="shopping"><span class="rail-icon" data-icon="cart"></span><span>Shopping</span></button>
    <button type="button" class="rail-item" data-go="photos"><span class="rail-icon" data-icon="photo"></span><span>Photos</span></button>
    <button type="button" class="rail-item" data-go="control"><span class="rail-icon" data-icon="sliders"></span><span>Control</span></button>
    <button type="button" class="rail-item" data-go="claude"><span class="rail-icon" data-icon="robot"></span><span>Claude</span></button>
    <button type="button" class="rail-clock" id="railClock" aria-label="Clock: tap to switch theme"></button>
  </nav>
  <main class="views">
    <section class="view" data-view="home"></section>
    <section class="view" data-view="calendar"></section>
    <section class="view" data-view="tasks"></section>
    <section class="view" data-view="shopping"></section>
    <section class="view" data-view="photos"></section>
    <section class="view" data-view="control"></section>
    <section class="view" data-view="claude"></section>
  </main>
  <div id="stale"></div>
  <div id="overlay"></div>
  <div id="toasts"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
